<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Precifarm">
  <rect width="64" height="64" rx="10" fill="#FFFFFF"/>

  <!-- Solar panel mark in perspective -->
  <g>
    <path d="M8,20 L52,20 L48,48 L12,48 Z" fill="#1F4E5F" stroke="#0F2832" stroke-width="1" stroke-linejoin="round"/>
    <!-- Vertical cell dividers -->
    <line x1="19" y1="20" x2="17" y2="48" stroke="#0F2832" stroke-width="0.7" opacity="0.55"/>
    <line x1="30" y1="20" x2="27" y2="48" stroke="#0F2832" stroke-width="0.7" opacity="0.55"/>
    <line x1="41" y1="20" x2="37" y2="48" stroke="#0F2832" stroke-width="0.7" opacity="0.55"/>
    <!-- Horizontal cell dividers -->
    <line x1="10" y1="29" x2="50" y2="29" stroke="#0F2832" stroke-width="0.7" opacity="0.55"/>
    <line x1="11" y1="38" x2="49" y2="38" stroke="#0F2832" stroke-width="0.7" opacity="0.55"/>
    <!-- Top highlight -->
    <path d="M8,20 L52,20 L51,22 L9,22 Z" fill="#2A6878" opacity="0.6"/>
  </g>

  <!-- Orange flame accent -->
  <g>
    <path d="M43,18 C46,12 52,10 53,15 C54,20 50,24 45,25 C42,24 41,21 43,18 Z" fill="#E37E32"/>
    <path d="M46,16 C48,13 51,14 50,17 C49,21 45,21 46,16 Z" fill="#F5C518" opacity="0.85"/>
  </g>
</svg>
